# Other applications (plan, section 4.2).

[[rule]]
id = "steam-htmlcache"
title = "Steam web cache"
title_pt_br = "Cache web do Steam"
class = "regenerable-cache"
action = "quarantine"
paths = ['%LOCALAPPDATA%\Steam\htmlcache']
evidence = "The cache of Steam's built-in browser; Steam rebuilds it."
evidence_pt_br = "O cache do navegador embutido do Steam; o Steam o reconstrói."
source = "Steam support: clearing the web browser cache."
source_pt_br = "Suporte do Steam: limpar o cache do navegador web."
cost = "Store and community pages load slower once."
cost_pt_br = "As páginas da loja e da comunidade carregam mais devagar uma vez."
last_verified = "2026-11-07"

[[rule.require]]
kind = "process-not-running"
names = ["steam.exe", "steamwebhelper.exe"]

[[rule]]
id = "claude-desktop-data"
title = "Claude desktop data and Cowork VM bundle"
title_pt_br = "Dados do Claude desktop e pacote da VM do Cowork"
class = "app-managed"
action = "report-only"
paths = ['%LOCALAPPDATA%\Claude-Data\**', '%APPDATA%\Claude\**']
evidence = "Claude's own README.txt in Claude-Data says never to delete this folder. The Cowork VM bundle (several GB) can exist under two names that are hard links to one file: deleting one name frees 0 bytes, and the app downloads it again."
evidence_pt_br = "O próprio README.txt do Claude em Claude-Data diz para nunca apagar esta pasta. O pacote da VM do Cowork (vários GB) pode existir com dois nomes que são hard links do mesmo arquivo: apagar um nome libera 0 byte, e o app baixa de novo."
source = "Claude-Data\\README.txt, shipped by the app; deleting one name of a file that has another hard link frees no space (`fsutil hardlink list` shows the names)."
source_pt_br = "Claude-Data\\README.txt, entregue pelo app; apagar um nome de um arquivo que tem outro hard link não libera espaço (`fsutil hardlink list` mostra os nomes)."
cost = "The app breaks or downloads everything again."
cost_pt_br = "O app quebra ou baixa tudo de novo."
instructions = "In Claude: Settings > This computer > System > Storage, or Help > Troubleshooting > Clear Cache and Restart."
instructions_pt_br = "No Claude: Configurações > Este computador > Sistema > Armazenamento, ou Ajuda > Solução de problemas > Limpar cache e reiniciar."
last_verified = "2026-11-07"

[[rule]]
id = "edge-cache"
title = "Microsoft Edge cache"
title_pt_br = "Cache do Microsoft Edge"
class = "regenerable-cache"
action = "quarantine"
paths = [
  '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Cache',
  '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\Code Cache',
  '%LOCALAPPDATA%\Microsoft\Edge\User Data\*\GPUCache',
]
evidence = "The HTTP, compiled-script and GPU shader caches of each Edge profile (Default, Profile 1, ...); Edge rebuilds them as pages are visited. Only these named cache folders: the rest of a profile (history, passwords, cookies) is browser profile data and is never touched."
evidence_pt_br = "Os caches HTTP, de scripts compilados e de shaders de GPU de cada perfil do Edge (Default, Profile 1, ...); o Edge os reconstrói conforme as páginas são visitadas. Apenas estas pastas de cache nomeadas: o resto do perfil (histórico, senhas, cookies) é dado de perfil do navegador e nunca é tocado."
source = "Microsoft Edge: Settings > Privacy, search, and services > Clear browsing data > Cached images and files (the same cache)."
source_pt_br = "Microsoft Edge: Configurações > Privacidade, pesquisa e serviços > Limpar dados de navegação > Imagens e arquivos armazenados em cache (o mesmo cache)."
cost = "Pages and scripts load again once, a little slower."
cost_pt_br = "As páginas e os scripts carregam de novo uma vez, um pouco mais devagar."
instructions = "Edge: Settings > Privacy, search, and services > Clear browsing data > Cached images and files."
instructions_pt_br = "Edge: Configurações > Privacidade, pesquisa e serviços > Limpar dados de navegação > Imagens e arquivos armazenados em cache."
last_verified = "2026-11-11"

[[rule.require]]
kind = "process-not-running"
names = ["msedge.exe"]
