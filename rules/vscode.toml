# VS Code family (plan, section 4.2): VS Code, VS Code Insiders, Cursor, and the C/C++
# extension's IntelliSense cache. Rules are data reviewed like code and compiled into wdc.exe.
#
# A rule applies to an item when its path pattern matches and every `match` condition passes;
# the item is eligible when every `require` condition passes too. Patterns use environment
# variables, `*` inside one folder name, and a final `**` for a whole tree.
#
# The patterns name the top-level folders of each editor's data. Before the first apply on a
# machine, `wdc explain` on the real folders confirms the patterns.

[[rule]]
id = "vscode-obsolete-extension"
title = "VS Code obsolete extension"
title_pt_br = "Extensão obsoleta do VS Code"
class = "install-leftover"
action = "quarantine"
paths = ['%USERPROFILE%\.vscode\extensions\*']
evidence = "VS Code lists extension folders it will remove in `extensions\\.obsolete`, and often does not finish. A folder listed there that `extensions.json` no longer references is a leftover of an update or uninstall."
evidence_pt_br = "O VS Code lista em `extensions\\.obsolete` as pastas de extensões que vai remover, e muitas vezes não termina. Uma pasta listada ali que o `extensions.json` não referencia mais é sobra de uma atualização ou desinstalação."
source = "VS Code keeps the list of extensions pending removal in `extensions\\.obsolete`."
source_pt_br = "O VS Code guarda a lista de extensões a remover em `extensions\\.obsolete`."
cost = "None: VS Code already replaced or removed this extension."
cost_pt_br = "Nenhum: o VS Code já substituiu ou removeu esta extensão."
last_verified = "2026-11-07"

[[rule.match]]
kind = "listed-in-file"
file = '%USERPROFILE%\.vscode\extensions\.obsolete'
format = "json-object-keys"

[[rule.require]]
kind = "not-referenced-by"
file = '%USERPROFILE%\.vscode\extensions\extensions.json'
format = "vscode-extensions-json"

[[rule.require]]
kind = "process-not-running"
names = ["Code.exe"]

[[rule]]
id = "vscode-staging-folder"
title = "VS Code interrupted extension install"
title_pt_br = "Instalação interrompida de extensão do VS Code"
class = "install-leftover"
action = "quarantine"
paths = ['%USERPROFILE%\.vscode\extensions\*']
evidence = "Folders named like a GUID in `extensions` are extraction folders of extension installs. One older than a day that `extensions.json` does not reference was left by an install that did not finish."
evidence_pt_br = "Pastas com nome de GUID em `extensions` são pastas de extração de instalações de extensões. Uma com mais de um dia que o `extensions.json` não referencia sobrou de uma instalação que não terminou."
source = "VS Code extension layout: `extensions.json` lists the installed extensions, and a GUID-named folder in `extensions` that it does not list is an extraction folder."
source_pt_br = "Estrutura de extensões do VS Code: o `extensions.json` lista as extensões instaladas, e uma pasta com nome de GUID em `extensions` que ele não lista é uma pasta de extração."
cost = "None: the install it belonged to did not complete."
cost_pt_br = "Nenhum: a instalação a que pertencia não terminou."
last_verified = "2026-11-07"

[[rule.match]]
kind = "name-matches-regex"
pattern = '^\.?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'

[[rule.require]]
kind = "older-than"
days = 1

[[rule.require]]
kind = "not-referenced-by"
file = '%USERPROFILE%\.vscode\extensions\extensions.json'
format = "vscode-extensions-json"

[[rule.require]]
kind = "process-not-running"
names = ["Code.exe"]

[[rule]]
id = "vscode-installed-extension"
title = "VS Code extension"
title_pt_br = "Extensão do VS Code"
class = "app-managed"
action = "open-app-setting"
paths = ['%USERPROFILE%\.vscode\extensions\*']
evidence = "An extension folder that is not listed as obsolete: an installed extension, or one VS Code still manages."
evidence_pt_br = "Uma pasta de extensão que não está listada como obsoleta: uma extensão instalada, ou que o VS Code ainda gerencia."
source = "VS Code extension layout."
source_pt_br = "Estrutura de extensões do VS Code."
cost = "Removing it by hand breaks the extension."
cost_pt_br = "Removê-la à mão quebra a extensão."
instructions = "Uninstall it from the Extensions view of VS Code."
instructions_pt_br = "Desinstale pela visão Extensões do VS Code."
last_verified = "2026-11-07"

[[rule]]
id = "vscode-caches"
title = "VS Code caches"
title_pt_br = "Caches do VS Code"
class = "regenerable-cache"
action = "quarantine"
paths = ['%APPDATA%\Code\Cache', '%APPDATA%\Code\CachedData', '%APPDATA%\Code\CachedExtensionVSIXs', '%APPDATA%\Code\Code Cache', '%APPDATA%\Code\GPUCache']
evidence = "Chromium and VS Code caches: VS Code rebuilds them on its next start."
evidence_pt_br = "Caches do Chromium e do VS Code: o VS Code os reconstrói na próxima vez que abre."
source = "Electron: the Chromium disk cache folders (Cache, CachedData, Code Cache, GPUCache) in the application's data folder."
source_pt_br = "Electron: as pastas de cache em disco do Chromium (Cache, CachedData, Code Cache, GPUCache) na pasta de dados do aplicativo."
cost = "VS Code starts a little slower once; downloaded extension packages are fetched again when needed."
cost_pt_br = "O VS Code abre um pouco mais devagar uma vez; pacotes de extensões baixados são baixados de novo quando preciso."
last_verified = "2026-11-07"

[[rule.require]]
kind = "process-not-running"
names = ["Code.exe"]

[[rule]]
id = "vscode-workspace-storage"
title = "VS Code workspace storage"
title_pt_br = "Armazenamento de workspaces do VS Code"
class = "app-managed"
action = "report-only"
paths = ['%APPDATA%\Code\User\workspaceStorage']
evidence = "Per-workspace state (open editors, local history, extension data). Not a cache: losing it loses that state."
evidence_pt_br = "Estado de cada workspace (editores abertos, histórico local, dados de extensões). Não é cache: apagar perde esse estado."
source = "VS Code user data layout."
source_pt_br = "Estrutura da pasta de dados do usuário do VS Code."
cost = "The state of every workspace."
cost_pt_br = "O estado de cada workspace."
instructions = "Folders of workspaces you no longer use can be removed from inside VS Code by reopening and closing them; report-only here."
instructions_pt_br = "Pastas de workspaces que você não usa mais podem ser removidas pelo próprio VS Code; aqui é só relatório."
last_verified = "2026-11-07"

