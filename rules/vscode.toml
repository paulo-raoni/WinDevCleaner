[[rule]]
id = "cpptools-ipch"
title = "C/C++ extension IntelliSense cache"
title_pt_br = "Cache do IntelliSense da extensão C/C++"
class = "regenerable-cache"
action = "quarantine"
paths = ['%LOCALAPPDATA%\Microsoft\vscode-cpptools\ipch']
evidence = "Precompiled headers of the C/C++ extension; rebuilt when a project is opened again."
evidence_pt_br = "Cabeçalhos pré-compilados da extensão C/C++; reconstruídos quando um projeto é aberto de novo."
source = "C/C++ extension documentation (C_Cpp.intelliSenseCachePath)."
source_pt_br = "Documentação da extensão C/C++ (C_Cpp.intelliSenseCachePath)."
cost = "The first IntelliSense of each project is slower once."
cost_pt_br = "O primeiro IntelliSense de cada projeto fica mais lento uma vez."
instructions = "The extension also limits it with the setting `C_Cpp.intelliSenseCacheSize`."
instructions_pt_br = "A extensão também limita o tamanho com a configuração `C_Cpp.intelliSenseCacheSize`."
last_verified = "2026-11-07"

[[rule.require]]
kind = "process-not-running"
names = ["Code.exe", "Code - Insiders.exe", "Cursor.exe"]
